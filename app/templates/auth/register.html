{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 glass rounded-[24px] p-8">
  <h1 class="text-2xl font-extrabold">Create account</h1>
  <p class="text-sm text-white/50 mt-1">Gmail code via Resend API (works on Render)</p>
  <form method="POST" class="mt-6 space-y-4">
    <input name="email" type="email" required placeholder="your@gmail.com" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-violet-500">
    <input name="password" type="password" required placeholder="Password (min 6)" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-violet-500">
    <button type="submit" class="w-full py-3 bg-violet-600 rounded-xl font-bold">Send Gmail Code</button>
  </form>
  <p class="mt-4 text-sm text-center text-white/50">Have account? <a href="/auth/login" class="text-violet-400">Login</a></p>
  <div class="mt-6 p-3 rounded-xl bg-white/5 text-xs text-white/40">
    No Resend key? Code will appear in popup + Render Logs. Add RESEND_API_KEY for real Gmail delivery.
  </div>
</div>
{% endblock %}
