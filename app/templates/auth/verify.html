{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 glass rounded-[24px] p-8 text-center">
  <h1 class="text-2xl font-extrabold">Enter code</h1>
  <p class="text-sm text-white/50 mt-1">Sent to {{ email }} via Resend API (port 443)</p>
  <form method="POST" class="mt-6 space-y-4">
    <input type="hidden" name="email" value="{{ email }}">
    <input name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" required placeholder="6-digit code" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl text-center text-2xl mono tracking-[0.5em] outline-none focus:border-violet-500">
    <button type="submit" class="w-full py-3 bg-violet-600 rounded-xl font-bold">Verify & Enter SensiLab</button>
  </form>
  <button id="resendBtn" class="mt-4 text-sm text-violet-400">Resend code</button>
  <div id="resendInfo" class="mt-3 text-xs text-white/40"></div>
</div>
<script>
document.getElementById('resendBtn').onclick=async()=>{
  const res = await fetch('/auth/resend-code',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:"{{ email }}"})});
  const data = await res.json();
  document.getElementById('resendInfo').innerText = data.msg + (data.code_for_debug ? " | CODE: "+data.code_for_debug : "");
  if(data.code_for_debug) alert("DEV CODE: "+data.code_for_debug+"\nAdd RESEND_API_KEY in Render for real Gmail");
}
</script>
{% endblock %}
