{% extends "admin/layout.html" %}
{% block title %}{{ 'Edit' if project else 'New' }} Project - Admin{% endblock %}
{% block content %}
<div class="topbar"><h1>{{ 'Edit' if project else 'New' }} Project</h1><a href="/admin/projects" class="btn btn-secondary">Back</a></div>
<div class="admin-card">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div style="display:grid;gap:14px">
    <div><label class="label">Title *</label><input class="input" name="title" required value="{{ project.title if project else '' }}"></div>
    <div><label class="label">Short description</label><input class="input" name="short_description" value="{{ project.short_description if project else '' }}"></div>
    <div><label class="label">Description *</label><textarea class="textarea" name="description" required rows="5">{{ project.description if project else '' }}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label class="label">Image URL</label><input class="input" name="image_url" value="{{ project.image_url if project else '' }}" placeholder="https://..."></div>
      <div><label class="label">Category</label><input class="input" name="category" value="{{ project.category if project else '' }}" placeholder="Bot, Website, etc"></div>
    </div>
    <div><label class="label">Technologies (comma separated)</label><input class="input" name="technologies" value="{{ project.technologies if project else '' }}" placeholder="Python, Flask, Telegram API"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label class="label">Live URL</label><input class="input" name="live_url" value="{{ project.live_url if project else '' }}"></div>
      <div><label class="label">Source URL</label><input class="input" name="source_url" value="{{ project.source_url if project else '' }}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div><label class="label">Order</label><input class="input" type="number" name="order_index" value="{{ project.order_index if project else 0 }}"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" name="is_featured" {% if project and project.is_featured %}checked{% endif %}> Featured</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" name="is_published" {% if not project or project.is_published %}checked{% endif %}> Published</div>
    </div>
    <button class="btn btn-primary">Save project</button>
  </div>
</form>
</div>
{% endblock %}
