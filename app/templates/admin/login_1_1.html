<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - FG (HefGe)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin">
<div class="login-wrap">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#00ffc6);display:grid;place-items:center;color:#001018;font-weight:800">FG</div>
      <div>
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:1.2rem">FG (HefGe)</div>
        <div style="font-size:0.85rem;color:#8a94b8">Admin access</div>
      </div>
    </div>
    {% if error %}<div style="padding:10px 12px;border-radius:10px;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);color:#ff9a9a;margin-bottom:14px;font-size:0.9rem">{{ error }}</div>{% endif %}
    <form method="POST">
      <div style="margin-bottom:14px"><label style="font-size:0.85rem;color:#8a94b8;display:block;margin-bottom:6px">Username</label><input class="input" name="username" required autocomplete="username" placeholder="admin"></div>
      <div style="margin-bottom:18px"><label style="font-size:0.85rem;color:#8a94b8;display:block;margin-bottom:6px">Password</label><input class="input" type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center">Login →</button>
    </form>
    <div style="margin-top:16px;font-size:0.8rem;color:#5a658a;text-align:center">Secure login • Rate limited • Hashed passwords</div>
  </div>
</div>
</body>
</html>
