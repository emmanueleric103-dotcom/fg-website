{% extends "admin/layout.html" %}
{% block title %}Settings - Admin{% endblock %}
{% block content %}
<div class="topbar"><h1>Website Settings</h1></div>

<div class="admin-card">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h3 style="margin-bottom:12px">Brand</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label class="label">Brand name</label><input class="input" name="brand_name" value="{{ settings.brand_name }}"></div>
    <div><label class="label">Tagline</label><input class="input" name="brand_tagline" value="{{ settings.brand_tagline }}"></div>
  </div>
  <div style="margin-top:12px"><label class="label">Brand description (footer)</label><textarea class="textarea" name="brand_description" rows="2">{{ settings.brand_description }}</textarea></div>

  <h3 style="margin:20px 0 12px">Homepage</h3>
  <div><label class="label">Headline</label><input class="input" name="homepage_headline" value="{{ settings.homepage_headline }}"></div>
  <div style="margin-top:12px"><label class="label">Subheadline</label><textarea class="textarea" name="homepage_subheadline" rows="2">{{ settings.homepage_subheadline }}</textarea></div>

  <h3 style="margin:20px 0 12px">About</h3>
  <div><label class="label">About content</label><textarea class="textarea" name="about_content" rows="6">{{ settings.about_content }}</textarea></div>

  <h3 style="margin:20px 0 12px">Contact details (no fake defaults - leave empty until real)</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label class="label">Contact email</label><input class="input" name="contact_email" value="{{ settings.contact_email }}" placeholder="you@example.com"></div>
    <div><label class="label">Phone (optional)</label><input class="input" name="contact_phone" value="{{ settings.contact_phone }}"></div>
    <div><label class="label">WhatsApp number (e.g. 2348012345678 - no +)</label><input class="input" name="whatsapp_number" value="{{ settings.whatsapp_number }}" placeholder="234..."></div>
    <div><label class="label">Telegram URL</label><input class="input" name="telegram_url" value="{{ settings.telegram_url }}" placeholder="https://t.me/yourhandle"></div>
  </div>

  <h3 style="margin:20px 0 12px">Social links</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label class="label">GitHub URL</label><input class="input" name="github_url" value="{{ settings.github_url }}"></div>
    <div><label class="label">Twitter/X URL</label><input class="input" name="twitter_url" value="{{ settings.twitter_url }}"></div>
    <div><label class="label">LinkedIn URL</label><input class="input" name="linkedin_url" value="{{ settings.linkedin_url }}"></div>
    <div><label class="label">Instagram URL</label><input class="input" name="instagram_url" value="{{ settings.instagram_url }}"></div>
  </div>

  <h3 style="margin:20px 0 12px">SEO</h3>
  <div><label class="label">SEO Title</label><input class="input" name="seo_title" value="{{ settings.seo_title }}"></div>
  <div style="margin-top:12px"><label class="label">SEO Description</label><textarea class="textarea" name="seo_description" rows="2">{{ settings.seo_description }}</textarea></div>

  <h3 style="margin:20px 0 12px">Privacy & System</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label class="label">Timezone</label><input class="input" name="timezone" value="{{ settings.timezone }}"></div>
    <div><label class="label">Analytics retention days</label><input class="input" name="analytics_retention_days" value="{{ settings.analytics_retention_days }}"></div>
  </div>
  <div style="margin-top:12px"><label class="label">Privacy notice</label><textarea class="textarea" name="privacy_notice" rows="3">{{ settings.privacy_notice }}</textarea></div>

  <div style="margin-top:20px"><button class="btn btn-primary">Save all settings</button></div>
</form>
</div>

<div class="admin-card" style="margin-top:18px">
  <h3>Change admin password</h3>
  <form method="POST" action="/admin/settings/password" style="margin-top:12px;display:grid;gap:12px;max-width:400px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input class="input" type="password" name="current_password" placeholder="Current password" required>
    <input class="input" type="password" name="new_password" placeholder="New password (min 8 chars)" required>
    <input class="input" type="password" name="confirm_password" placeholder="Confirm new password" required>
    <button class="btn btn-secondary">Change password</button>
  </form>
</div>
{% endblock %}
